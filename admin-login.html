<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Sign In | Anti-Rabies Locator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/login.css">
  <link rel="stylesheet" href="/responsive.css">
</head>
<body>
  <header class="top-header">
    <div class="logo-section">
      <div class="logo-icon"><i class="fa-solid fa-shield-dog"></i></div>
      <div><h2>Anti-Rabies Locator</h2><p>Administrator Portal</p></div>
    </div>
    <a href="/" class="back-link">Back to Vaccine Locator</a>
  </header>
  <main class="main-container">
    <div class="main-logo">
      <div class="big-logo"><i class="fa-solid fa-user-shield"></i></div>
      <h1>Administrator Sign In</h1>
      <p>Use your administrator account to access system management and analytics.</p>
    </div>
    <section class="login-card" style="max-width:560px;margin:auto;grid-template-columns:1fr;">
      <div class="signin-section">
        <h2>Sign In</h2>
        <form id="adminLoginForm">
          <label for="emailInput">Email</label>
          <input id="emailInput" type="email" autocomplete="email" required>
          <label for="passwordInput">Password</label>
          <div class="password-input-wrapper">
            <input id="passwordInput" type="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
          <div class="login-message" id="loginMessage" role="alert" aria-live="polite" hidden><i class="fa-solid fa-circle-exclamation"></i><span id="loginMessageText"></span></div>
          <button type="submit" class="login-btn" id="loginBtn">Sign In to Admin Dashboard</button>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="/scripts/admin-login.js"></script>
</body>
</html>
