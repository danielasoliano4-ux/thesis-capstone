<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications - Anti-Rabies Locator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="resident.css">
    <link rel="stylesheet" href="notifications.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <header class="top-header">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fa-solid fa-shield-dog"></i>
            </div>
            <div>
                <h2>Anti-Rabies Locator</h2>
                <p>Cabuyao, Laguna</p>
            </div>
        </div>
        <div class="header-right">
            <h3 id="headerName">Guest</h3>
            <a href="notifications.html" style="color:#374151;font-size:20px;position:relative;" id="notifBell">
                <i class="fa-regular fa-bell"></i>
            </a>
            <button class="signout-btn" id="signOutBtn" style="display:none;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
            </button>
        </div>
    </header>

    <!-- NAV TABS -->
    <nav class="nav-tabs-bar" id="navTabs" style="margin-bottom:18px;">
        <a class="nav-tab" href="residents.html"><i class="fa-solid fa-house"></i> Overview</a>
        <a class="nav-tab" href="residents.html#panel-appointments"><i class="fa-regular fa-calendar"></i> Appointments</a>
        <a class="nav-tab" href="first-aid.html"><i class="fa-solid fa-kit-medical"></i> First Aid Guide</a>
        <a class="nav-tab active"><i class="fa-regular fa-bell"></i> Notifications</a>
    </nav>

    <div class="notif-container">

        <!-- (Appointments-style inline panel removed) -->

        <div class="notif-header-row">
            <div>
                <h1><i class="fa-regular fa-bell" style="color:#ef0000;margin-right:10px;"></i>Notifications</h1>
                <p style="font-size:13px;color:#6b7280;margin-top:4px;">You have <strong id="unreadCount">0</strong> unread notifications</p>
            </div>
            <button class="mark-all-btn" id="markAllReadBtn">
                <i class="fa-solid fa-check-double"></i> Mark all as read
            </button>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="appointment">Appointments</button>
            <button class="filter-tab" data-filter="vaccine">Vaccine Updates</button>
            <button class="filter-tab" data-filter="system">System</button>
        </div>

        <div id="notificationsList" aria-live="polite"></div>

        <div class="empty-state" id="emptyState">
            <i class="fa-regular fa-bell-slash"></i>
            <p>No notifications in this category</p>
        </div>

        

        <div class="settings-link">
            <p>Want to manage notification preferences? <a href="#">Notification Settings</a></p>
        </div>

    </div>
        <script type="module" src="scripts/notifications.js"></script>
</body>
</html>
